[project]
name = "bugscanx-zl"
dynamic = ["version"]
description = "BugScanX-ZL - all-in-one tool for SNI discovery (ZL fork of bugscan-x)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Ayan Rajpoot", email = "ayanrajpoot2004@gmail.com" }
]

keywords = [
    "sni",
    "scanning-tool",
    "subdomain-enumeration",
    "bughost",
    "cidr-scanning",
    "reverse-ip-lookup"
]

dependencies = [
    "beautifulsoup4",
    "dnspython",
    "InquirerPy",
    "packaging",
    "pyfiglet",
    "requests",
    "rich",
    "tldextract>=3.1",
    "tqdm",
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/x-kevinbro/bugscanx-zl"
Upstream = "https://github.com/FreeNetLabs/bugscanx"

[project.scripts]
bugscanx = "bugscanx.main:main"
bugscan-x = "bugscanx.main:main"
bx = "bugscanx.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find = {}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
